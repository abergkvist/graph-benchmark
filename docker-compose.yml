services:
  neo4j:
    image: neo4j:5.26.29-community
    environment:
      NEO4J_AUTH: neo4j/benchmark
      NEO4J_server_default__advertised__address: 127.0.0.1
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_apoc_export_file_enabled: true
      NEO4J_apoc_import_file_enabled: true
      NEO4J_apoc_import_file_use__neo4j__config: true
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_max__size: 1500m
      # GDS procedures must be explicitly allowed in community
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
    volumes:
      - ./data:/var/lib/neo4j/import
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  memgraph:
    image: memgraph/memgraph-mage:3.12.0
    command:
      - "--memory-limit=4096"
      - "--log-level=WARNING"
      - "--query-execution-timeout-sec=300"
    volumes:
      - ./data:/usr/lib/memgraph/import-data:ro
    ports:
      - "7688:7687"
    healthcheck:
      # bash TCP check — nc is not guaranteed in this image
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/7687' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  memgraph-lab:
    image: memgraph/lab:latest
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: 7687
    ports:
      - "3000:3000"
    depends_on:
      memgraph:
        condition: service_healthy

  # Explorer for a Ladybug database created on the host with lbug.
  # Seed first: lbug ladybug/benchmark.lbdb -i seed/seed-ladybug.cypher
  # The database is single-writer, so stop this service before re-seeding.
  # Built locally because the published image lags behind lbug, see the Dockerfile.
  ladybug-explorer:
    build:
      context: ./docker/ladybug-explorer
      args:
        LBUG_VERSION: 0.20.4
    image: graph-benchmark/ladybug-explorer:0.20.4
    environment:
      LBUG_FILE: benchmark.lbdb
      MODE: READ_ONLY
    volumes:
      - ./ladybug:/database
      - ./data:/data:ro
    ports:
      - "8000:8000"

  arcadedb:
    image: arcadedata/arcadedb:latest
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g -Darcadedb.server.rootPassword=benchmark"
    volumes:
      - ./data:/home/arcadedb/import:ro
    ports:
      - "2480:2480"
      - "2424:2424"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Apache AGE is a Postgres extension, not a separate server. Seed after
  # startup: docker compose exec -T age psql -U postgres -d benchmark < seed/seed-age.sql
  age:
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    volumes:
      - ./data:/data:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benchmark"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Web UI for Apache AGE. No published image, and upstream's own Dockerfile
  # doesn't run as-is (see docker/age-viewer/Dockerfile), so it's built from
  # a local Dockerfile that clones the upstream source fresh at build time.
  # Log in through its form, it isn't configured via env vars: host "age",
  # port 5432, database "benchmark", user "postgres", password "benchmark",
  # graph "benchmark".
  age-viewer:
    build:
      context: ./docker/age-viewer
    image: graph-benchmark/age-viewer:latest
    ports:
      - "3001:3000"
    depends_on:
      age:
        condition: service_healthy
